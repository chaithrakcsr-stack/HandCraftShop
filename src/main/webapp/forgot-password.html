<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password | Handcraft Shop</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">HANDCRAFT SHOP</a><nav class="links"><a href="login.html">Sign in</a><a href="register.html">Register</a></nav></header><section class="hero"><span class="eyebrow">Account recovery</span><h1>Reset your password.</h1><p class="muted">We'll generate a one-time reset link that expires after 20 minutes.</p></section><section class="card" style="max-width:560px"><form id="forgotForm"><label>Account type</label><select name="accountType"><option value="customer">Customer</option><option value="seller">Seller</option><option value="admin">Admin</option></select><label>Email / Admin username</label><input name="email" type="email" required><button class="btn">Send reset link</button></form><div id="msg" class="status hidden"></div><p class="small">For local testing without SMTP, check the Eclipse/Tomcat console for the link.</p></section></div><script>
document.getElementById('forgotForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const x=await r.json(),m=document.getElementById('msg');m.classList.remove('hidden');m.textContent=x.message||x.error;});
</script><script src="chat-widget.js"></script></body></html>
