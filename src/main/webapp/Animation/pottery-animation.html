<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terracotta Wheel</title>
<style>
html,body{margin:0;height:100%;background:#050302;overflow:hidden}
#stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#050302}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var stage=document.getElementById('stage');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x050302);
scene.fog=new THREE.FogExp2(0x0a0503,0.06);
var camera=new THREE.PerspectiveCamera(32,16/9,0.1,50);

// lights
scene.add(new THREE.AmbientLight(0x3a2010,0.5));
var key=new THREE.SpotLight(0xffb060,2.6,20,0.6,0.7,1);key.position.set(-4,4,3);key.target.position.set(0,1,0);scene.add(key,key.target);
var rim=new THREE.SpotLight(0xffd27a,2.2,20,0.7,0.8,1);rim.position.set(3.5,3,-4);rim.target.position.set(0,1,0);scene.add(rim,rim.target);
var fill=new THREE.PointLight(0xff8a3a,0.8,10);fill.position.set(2.5,0.6,3);scene.add(fill);

// clay texture: horizontal throwing lines + grain
function clayTex(){
var c=document.createElement('canvas');c.width=256;c.height=512;var g=c.getContext('2d');
var d=g.createImageData(256,512);
for(var y=0;y<512;y++){var band=0.5+0.25*Math.sin(y*0.42)+0.15*Math.sin(y*1.3+2);
for(var x=0;x<256;x++){var n=Math.random()*0.35;var v=Math.max(0,Math.min(1,band*0.75+n))*255;var i=(y*256+x)*4;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}}
g.putImageData(d,0,0);
var t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1);return t;}
var tex=clayTex();
var clay=new THREE.MeshPhysicalMaterial({color:0xb3552d,roughness:0.55,bumpMap:tex,bumpScale:1.6,clearcoat:0.7,clearcoatRoughness:0.25,side:THREE.DoubleSide});

// vase profile (periodic in t -> seamless loop)
var SEG=72,N=60,vase=new THREE.Mesh(new THREE.BufferGeometry(),clay);
scene.add(vase);
function sstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}
function profile(s){
var H=1.1+1.25*s,pts=[],wall=0.07;
function R(u){
var belly=0.62+0.34*Math.sin(Math.PI*Math.pow(u,0.85))*(0.55+0.45*s)-0.18*(1-s)*u;
var neck=1-0.6*s*sstep(0.55,0.88,u);
var lip=1+0.12*sstep(0.93,1,u)*s;
return belly*neck*lip;}
for(var i=0;i<=N;i++){var u=i/N;pts.push(new THREE.Vector2(R(u),u*H+0.06));}
for(var j=N;j>=0;j--){var u2=j/N;pts.push(new THREE.Vector2(Math.max(0.02,R(u2)-wall),u2*H+0.06+(u2<0.02?0.05:0)));}
return pts;}

// wheel + pan
var wheel=new THREE.Group();scene.add(wheel);
var head=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.4,0.1,64),new THREE.MeshStandardMaterial({color:0x2a1c12,roughness:0.5,metalness:0.3}));head.position.y=0.0;wheel.add(head);
var slip=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.012,64),new THREE.MeshPhysicalMaterial({color:0x7a3b20,roughness:0.15,clearcoat:1}));slip.position.y=0.056;wheel.add(slip);
var pan=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.4,0.3,64,1,true),new THREE.MeshStandardMaterial({color:0x1b130d,roughness:0.6,side:THREE.DoubleSide}));pan.position.y=-0.2;scene.add(pan);
var floor=new THREE.Mesh(new THREE.CircleGeometry(2.55,64),new THREE.MeshPhysicalMaterial({color:0x2a1408,roughness:0.05,metalness:0.2,clearcoat:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-0.2;scene.add(floor);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x0d0805,roughness:0.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.36;scene.add(ground);

// background shelf silhouettes
var shelfMat=new THREE.MeshStandardMaterial({color:0x2c1a10,roughness:0.8});
for(var k=0;k<7;k++){var p=new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0.01,0),new THREE.Vector2(0.4,0.1),new THREE.Vector2(0.5,0.5),new THREE.Vector2(0.25,0.9),new THREE.Vector2(0.3,1.0)],20),shelfMat);
p.position.set(-6+k*2,-0.3+(k%2)*0.6,-7-(k%3));p.scale.setScalar(0.9+(k%3)*0.2);scene.add(p);}

// dust
var DN=220,dpos=new Float32Array(DN*3),seed=[];
for(var i=0;i<DN;i++){seed.push([Math.random()*8-4,Math.random(),Math.random()*6-3]);}
var dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dpos,3));
var dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xffc27a,size:0.025,transparent:true,opacity:0.55,depthWrite:false}));scene.add(dust);

var LOOP=8,REVS=6;
function render(time){
var t=(time/1000)%LOOP,f=t/LOOP,s=0.5-0.5*Math.cos(2*Math.PI*f);
var old=vase.geometry;vase.geometry=new THREE.LatheGeometry(profile(s),SEG);old.dispose();
var rot=f*REVS*2*Math.PI;vase.rotation.y=rot;wheel.rotation.y=rot;
var push=0.5-0.5*Math.cos(2*Math.PI*f);
camera.position.set(0.5-0.5*push,1.15+0.25*push,6.6-2.2*push);
camera.lookAt(0,0.95+0.25*push,0);
for(var i=0;i<DN;i++){var q=seed[i],y=((q[1]+f)%1)*4;dpos[i*3]=q[0]+Math.sin(f*6.283+i)*0.15;dpos[i*3+1]=y;dpos[i*3+2]=q[2];}
dg.attributes.position.needsUpdate=true;
renderer.render(scene,camera);
requestAnimationFrame(render);}
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();requestAnimationFrame(render);
})();
</script>
</body>
</html>
