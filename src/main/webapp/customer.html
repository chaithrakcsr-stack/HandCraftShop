<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Handcraft Shop</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">HANDCRAFT SHOP</a><nav class="links"><a href="index.html">Storefront</a><a href="seller.html">Sell with us</a><a href="#orders">My orders</a><a href="#wishlist">Wishlist</a><a href="#reviews">Reviews</a><button class="btn secondary" onclick="logout()">Sign out</button></nav></header><section class="hero"><span class="eyebrow">Customer atelier</span><h1 id="welcome">My account.</h1><p class="muted">Manage your profile, saved delivery addresses, orders and favourite handmade pieces.</p></section><div class="grid"><section class="card"><h2>Profile</h2><form id="profileForm"><label>Full name</label><input name="fullName" required><label>Email</label><input name="email" disabled><label>Phone</label><input name="phone"><label>Default address</label><textarea name="addressLine"></textarea><div class="fieldrow"><div><label>City</label><input name="city"></div><div><label>State</label><input name="state"></div><div><label>PIN code</label><input name="pincode"></div></div><button class="btn">Save profile</button></form><div id="profileMsg" class="small"></div></section><section class="card"><h2>Saved addresses</h2><div id="addresses"></div><form id="addressForm"><label>Label</label><input name="label" placeholder="Home / Work"><label>Recipient name</label><input name="recipientName" required><label>Phone</label><input name="phone" required><label>Address</label><textarea name="addressLine" required></textarea><div class="fieldrow"><div><label>City</label><input name="city" required></div><div><label>State</label><input name="state" required></div><div><label>PIN code</label><input name="pincode" required></div></div><label><input name="isDefault" type="checkbox" style="width:auto"> Make default</label><button class="btn secondary">Add address</button></form><div id="addressMsg" class="small"></div></section></div><section id="orders" class="card" style="margin:18px 0"><h2>Order history</h2><div id="ordersList">Loading orders…</div></section><section id="wishlist" class="card" style="margin:18px 0"><h2>Saved heirlooms</h2><div id="wishlistList"></div></section><section id="reviews" class="card" style="margin:18px 0"><h2>Write a product review</h2><form id="reviewForm"><label>Product</label><select name="productId" id="reviewProduct" required></select><label>Rating</label><select name="rating"><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select><label>Your review</label><textarea name="review" required></textarea><button class="btn">Submit review</button></form><div id="reviewMsg" class="small"></div></section></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(url){const r=await fetch(url);if(!r.ok)throw new Error((await r.json()).error||'Request failed');return r.json()}async function init(){const me=await get('api/auth/me');if(!me.authenticated||me.role!=='customer'){location.href='login.html';return;}document.getElementById('welcome').textContent='Welcome, '+me.name+'.';const p=await get('api/profile'),f=document.getElementById('profileForm');f.fullName.value=p.full_name||'';f.email.value=p.email||'';f.phone.value=p.phone||'';f.addressLine.value=p.address_line||'';f.city.value=p.city||'';f.state.value=p.state||'';f.pincode.value=p.pincode||'';loadAddresses();loadOrders();loadWishlist();const products=await get('api/products');document.getElementById('reviewProduct').innerHTML=products.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}
async function loadAddresses(){const a=await get('api/addresses');document.getElementById('addresses').innerHTML=a.length?a.map(x=>`<div class="item"><strong>${esc(x.label)}</strong> ${x.is_default?'· Default':''}<div>${esc(x.recipient_name)} · ${esc(x.phone)}</div><div class="small">${esc(x.address_line)}, ${esc(x.city)}, ${esc(x.state)} - ${esc(x.pincode)}</div><button class="btn secondary" onclick="editAddress(${x.address_id})">Edit</button><button class="btn danger" onclick="deleteAddress(${x.address_id})">Delete</button></div>`).join(''):'<p class="muted">No saved addresses yet.</p>';}
async function loadOrders(){const a=await get('api/orders');const grouped={};a.forEach(x=>(grouped[x.id]??={...x,items:[]}).items.push(x));const rows=Object.values(grouped);document.getElementById('ordersList').innerHTML=rows.length?rows.map(o=>`<div class="item"><div class="fieldrow"><div><h3>${esc(o.order_number)}</h3><div class="small">${new Date(o.created_at).toLocaleString()}</div></div><div><strong>${esc(o.status)}</strong><div class="small">Payment: ${esc(o.payment_status||'')}</div></div><div><strong>₹${Number(o.total_amount).toLocaleString('en-IN')}</strong></div></div><div class="small">Deliver to: ${esc(o.delivery_address)}, ${esc(o.delivery_city)}, ${esc(o.delivery_state)} - ${esc(o.delivery_pincode)} · ${esc(o.payment_method||'')}</div><ul>${o.items.map(i=>`<li>${esc(i.name)} × ${i.quantity} — ₹${i.unit_price}</li>`).join('')}</ul>${['PLACED','CONFIRMED'].includes(o.status)?`<button class="btn danger" onclick="cancelOrder(${o.id})">Cancel order</button>`:''}</div>`).join(''):'<p class="muted">No orders yet. <a href="index.html">Explore handmade products</a>.</p>';}
async function loadWishlist(){const a=await get('api/wishlist');document.getElementById('wishlistList').innerHTML=a.length?a.map(x=>`<div class="item"><strong>${esc(x.name)}</strong> · ${esc(x.category)} · ₹${x.priceINR}<button class="btn danger" onclick="removeWish(${x.id})">Remove</button></div>`).join(''):'<p class="muted">Your wishlist is empty.</p>';}
async function editAddress(id){const a=await get('api/addresses');const x=a.find(v=>v.address_id===id);if(!x)return;const label=prompt('Address label:',x.label);if(label===null)return;const recipientName=prompt('Recipient name:',x.recipient_name);if(recipientName===null)return;const phone=prompt('Phone:',x.phone);if(phone===null)return;const addressLine=prompt('Address:',x.address_line);if(addressLine===null)return;const city=prompt('City:',x.city);if(city===null)return;const state=prompt('State:',x.state);if(state===null)return;const pincode=prompt('PIN code:',x.pincode);if(pincode===null)return;const isDefault=confirm('Make this your default address?');const r=await fetch('api/addresses',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({addressId:id,label,recipientName,phone,addressLine,city,state,pincode,isDefault})});const z=await r.json();alert(z.message||z.error);loadAddresses();} async function deleteAddress(id){await fetch('api/addresses?id='+id,{method:'DELETE'});loadAddresses()}async function removeWish(id){await fetch('api/wishlist?productId='+id,{method:'DELETE'});loadWishlist()}async function cancelOrder(id){const reason=prompt('Reason for cancellation?','Changed my mind');if(reason===null)return;const r=await fetch('api/orders/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,reason})});const x=await r.json();alert(x.message||x.error);loadOrders()}
document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f);const r=await fetch('api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.getElementById('profileMsg').textContent=(await r.json()).message||'Profile saved.';});document.getElementById('addressForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f);d.isDefault=f.get('isDefault')==='on';const r=await fetch('api/addresses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();document.getElementById('addressMsg').textContent=x.error||'Address saved.';if(r.ok){e.target.reset();loadAddresses();}});document.getElementById('reviewForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();document.getElementById('reviewMsg').textContent=x.message||x.error;});async function logout(){await fetch('api/auth/logout',{method:'POST'});location.href='index.html'}init().catch(e=>{alert(e.message);location.href='login.html'});
</script><script src="chat-widget.js"></script></body></html>
