<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Handcraft Shop</title><link rel="stylesheet" href="portal.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">HANDCRAFT SHOP</a><nav class="links"><a href="login.html">Sign in</a><a href="index.html">Storefront</a></nav></header><section class="hero"><span class="eyebrow">Account security</span><h1>Set a new password.</h1></section><section class="card" style="max-width:560px"><form id="resetForm"><label>Account type</label><select name="accountType"><option value="customer">Customer</option><option value="seller">Seller</option><option value="admin">Admin</option></select><label>Email / Admin username</label><input name="email" type="email" required><label>Reset token</label><input name="token" required><label>New password</label><input name="password" type="password" minlength="8" required><button class="btn">Reset password</button></form><div id="msg" class="status hidden"></div></section></div><script>
const p=new URLSearchParams(location.search),f=document.getElementById('resetForm');f.token.value=p.get('token')||'';f.accountType.value=p.get('type')||'customer';f.email.value=p.get('email')||'';f.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const x=await r.json(),m=document.getElementById('msg');m.classList.remove('hidden');m.textContent=x.message||x.error;if(r.ok)setTimeout(()=>location.href='login.html',1000)});
</script><script src="chat-widget.js"></script></body></html>
